  <style>
    /* =========================================================
   CABEÇALHO
   ========================================================= */

.cabecalho {
  width: 100%;
  background-color: #0f172a;
  color: #f8fafc;
  font-family: Arial, sans-serif;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

/* Área principal do cabeçalho */
.cabecalho-topo {
  max-width: 1200px;
  min-height: 150px;
  margin: 0 auto;
  padding: 25px 20px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

/* Área dos logotipos */
.logos {
  display: flex;
  align-items: center;
  gap: 22px;
  flex-shrink: 0;
}

/* Logotipos */
.logourca {
  width: 75px;
  aspect-ratio: 1 / 1;
  border-radius: 55%;
  object-fit: cover;
}

.logonipe {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
}

.logocepec {
  width: 80px;
  height: 70px;
  object-fit: cover;
  border-radius: 50%;
}

.logolaec {
  width: 120px;
  height: 70px;
}

/* Área do título */
.cabecalho-titulo {
  flex: 1;
  text-align: right;
}

.titulo {
  margin: 0;
  color: #ffffff;
  font-size: 32px;
  font-weight: 600;
  line-height: 1.2;
}

.subtitulo {
  margin: 10px 0 0;
  color: #94a3b8;
  font-size: 14px;
  line-height: 1.5;
}

/* =========================================================
   BARRA DE NAVEGAÇÃO
   ========================================================= */

.navbar {
  width: 100%;
  min-height: 52px;
  margin: 0;
  padding: 0;
  box-sizing: border-box;

  background-color: #1e293b;
  border-top: 1px solid #334155;
  border-bottom: 1px solid #334155;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;

  list-style: none;
}

/* Cada opção */
.opcao {
  margin: 0;
}

/* Links */
.link {
  display: block;
  padding: 16px 22px;

  color: #cbd5e1;
  text-decoration: none;

  font-size: 14px;
  font-weight: 500;

  transition: all 0.2s ease;
}

/* Efeito ao passar o mouse */
.link:hover {
  color: #ffffff;
  background-color: #334155;
}

/* Página/área em destaque */
.link:focus,
.link:active {
  color: #38bdf8;
}


/* =========================================================
   RESPONSIVIDADE
   ========================================================= */

@media (max-width: 900px) {

  .cabecalho-topo {
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 25px 15px;
  }

  .logos {
    justify-content: center;
    flex-wrap: wrap;
  }

  .cabecalho-titulo {
    text-align: center;
  }

  .titulo {
    font-size: 26px;
  }

  .navbar {
    flex-wrap: wrap;
    padding: 5px 10px;
  }

  .link {
    padding: 12px 15px;
  }
}


@media (max-width: 600px) {

  .logos {
    gap: 12px;
  }

  .logourca {
    width: 70px;
    height: 40px;
  }

  .logonipe {
    width: 70px;
    height: 55px;
  }

  .logocepec {
    width: 60px;
    height: 70px;
  }

  .logolaec {
    width: 55px;
    height: 55px;
  }

  .titulo {
    font-size: 21px;
  }

  .subtitulo {
    font-size: 12px;
  }

  .navbar {
    flex-direction: column;
    gap: 0;
    padding: 0;
  }

  .opcao {
    width: 100%;
    text-align: center;
  }

  .link {
    padding: 13px;
    border-bottom: 1px solid #334155;
  }
}

    /* Estilos gerais do rodapé */
    .rodape-principal {
      background-color: #0f172a; /* Tom escuro elegante */
      color: #f8fafc;
      padding: 48px 20px 24px 20px;
      font-family: Arial, sans-serif;

    /* Container para alinhar as colunas */
    .rodape-container {

      display: flex;

      justify-content: space-between;
      gap: 30px;

    .rodape-coluna {

      min-width: 250px;
    }

    /* Títulos das colunas */
    .rodape-coluna h3 {

      font-size: 16px;
      margin-top: 0;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Parágrafos e textos */

    }

      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .rodape-coluna ul li a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Ícones de Mídias Sociais */
    .redes-sociais {

    .redes-sociais a {

      height: 32px;

      color: #f8fafc;
      text-align: center;
      line-height: 32px;
      border-radius: 4px;
      margin-right: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .redes-sociais a:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }

    /* Rodapé inferior (Copyright) */
    .rodape-inferior {
